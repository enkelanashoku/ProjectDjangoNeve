{% extends 'index.html' %}

{% block content %}

<div class="booking-container">

    <div class="booking-image">
        <img src="/static/images/heroo1.jpeg" alt="Beauty Treatment">
    </div>

    <div class="booking-text">
        <p class="subtitle">A LITTLE TIME FOR YOURSELF</p>
        <h1>Book Your Glow.</h1>
        <p>Your beauty moment awaits.</p>
    </div>

</div>

<style>
.booking-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
    padding: 40px;
}

.booking-image img {
    width: 100%;
    height: 450px;
    object-fit: cover;
    border-radius: 25px;
}

.booking-text {
    text-align: center;
    color: #55443e;
}

.booking-text h1 {
    font-size: 50px;
}

.subtitle {
    letter-spacing: 3px;
    color: #a78378;
}

@media(max-width: 768px) {
    .booking-container {
        grid-template-columns: 1fr;
    }
}
</style>

{% endblock %}
