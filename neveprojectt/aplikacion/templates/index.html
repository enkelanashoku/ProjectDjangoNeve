<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Néve | Aesthetic Studio</title>

    <meta name="description"
        content="Discover Néve Aesthetic Studio in Tirana. Explore beauty services, personalised self-care and our signature Glow O’Clock Ritual.">

    <meta name="theme-color" content="#F3EBDD">

    <!-- STYLESHEETS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=8">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    {% include 'navbar.html' %}

    {% block content %}
    {% endblock %}

    {% include 'footer.html' %}


   

    <!-- ==========================================
         10. BOOTSTRAP JAVASCRIPT
         Mobile navigation and reviews carousel
         ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('click', function(event) {

        const button = event.target.closest('a, button');

        if (!button) return;

        if (button.textContent.trim().toLowerCase().includes('book your glow')) {
            event.preventDefault();

            window.location.href = "{% url 'appointment' %}#booking-form";
        }

    });
</script>
</body>
</html>
